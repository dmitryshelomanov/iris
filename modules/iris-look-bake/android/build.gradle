plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.irislookbake'
version = '0.1.0'

android {
  namespace "expo.modules.irislookbake"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
  sourceSets {
    main {
      // Shared ONNX weights next to the Expo module root.
      assets.srcDirs += ['../assets/models']
    }
  }
}

dependencies {
  implementation "com.microsoft.onnxruntime:onnxruntime-android:1.20.0"
  implementation "androidx.exifinterface:exifinterface:1.3.7"
}
